<!doctype html><html lang="en"><meta charset="utf-8"><title>Iqri browser recognition check</title><style>body{font:16px system-ui;padding:35px;background:#f8f7f2;color:#163f35}button{padding:15px}pre{white-space:pre-wrap}</style><h1>Browser recognition check</h1><p>Runs the actual Quran voice model on a short public test recitation.</p><button id="run">Run browser check</button><pre id="result">Ready.</pre><script type="module">
const output=document.querySelector('#result');const button=document.querySelector('#run');
button.onclick=()=>{button.disabled=true;const worker=new Worker('/recognition-worker.js',{type:'module'});output.textContent='Loading actual browser model…';worker.onerror=e=>{output.textContent='FAIL: '+e.message;button.disabled=false;};worker.onmessage=async({data})=>{if(data.type==='progress')output.textContent=data.message;if(data.type==='error'){output.textContent='FAIL: '+data.message;button.disabled=false;}if(data.type==='ready'){output.textContent='Model ready. Decoding sample…';const decoder=new AudioContext();const audio=await decoder.decodeAudioData(await(await fetch('/_sample.wav')).arrayBuffer());await decoder.close();const off=new OfflineAudioContext(1,Math.ceil(audio.duration*16000),16000);const source=off.createBufferSource();source.buffer=audio;source.connect(off.destination);source.start();const pcm=(await off.startRendering()).getChannelData(0);worker.postMessage({type:'transcribe',id:2,audio:pcm});}if(data.type==='result'){const p=data.prediction;output.textContent=JSON.stringify({pass:p.surah===112&&p.ayah===1,prediction:p},null,2);worker.terminate();button.disabled=false;}};worker.postMessage({type:'load',id:1,baseUrl:location.origin+'/models/',wasmPaths:'/ort/'});};
</script></html>
